<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS pays no attention to the manifest's icons for the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000031" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>choai</title>
    <meta name="description" content="Your hledger journal, in the browser." />
    <!-- The scheme has to be settled before the first paint, or a dark screen
         opens white and then turns. That is early enough that no module has
         loaded yet, so the stored choice is read here as well as in
         src/core/lib/theme.ts, which owns it and keeps these marks true afterwards. -->
    <script>
      ;(() => {
        const stored = (() => {
          try {
            return localStorage.getItem("choai.scheme")
          } catch {
            return null
          }
        })()
        const dark =
          stored === "dark" ||
          (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        const root = document.documentElement
        root.classList.toggle("dark", dark)
        root.dataset.kbTheme = dark ? "dark" : "light"
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
